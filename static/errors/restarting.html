<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5">
  <title>Pimmich redémarre…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif;
           background: #f5f6fb; color: #1f2333; text-align: center; padding: 16px; box-sizing: border-box; }
    .spinner { width: 46px; height: 46px; border: 5px solid #d9dcef; border-top-color: #4f46e5; border-radius: 50%;
               animation: turn 1s linear infinite; margin: 0 auto 20px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    p { color: #6b7080; }
    @media (prefers-color-scheme: dark) { body { background: #14161f; color: #eef0f8; } p { color: #9aa0b4; } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h1>Pimmich redémarre…</h1>
    <p>Restarting · Reiniciando · Neustart · 再起動中</p>
    <p>La page se recharge toute seule dans quelques secondes.</p>
  </div>
</body>
</html>
