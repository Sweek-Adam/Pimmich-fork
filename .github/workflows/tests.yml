name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04  # version figée : pas de changement de système imposé (passage à 26.04 le moment venu)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Python (dernière version stable)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip

      - name: Polices (rendu des messages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilation de la nouvelle interface (types compris)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: static/app est à jour avec les sources
        run: |
          git status --porcelain -- static/app
          test -z "$(git status --porcelain -- static/app)" || (echo "Relancez « npm run build » dans frontend/ et versionnez static/app." && exit 1)
